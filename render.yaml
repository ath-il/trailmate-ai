# Render Blueprint for TrailMate AI (Best Use of Render).
#
# Deploys the app as a fully static site. Render runs `npm run build` and serves
# the resulting `dist/` folder over HTTPS. No server, no environment secrets:
# the site is a pure client-side PWA, so hosting it never breaks offline use.
#
# Steps: push this repo to GitHub/GitLab, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. See README for details.
services:
  - type: web
    name: trailmate-ai
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    # SPA fallback: unknown paths serve the app shell (there is no backend).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Cache policy: immutable hashed assets, never-cache the service worker.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /icons/*
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /registerSW.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /index.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /manifest.webmanifest
        name: Cache-Control
        value: "no-cache"
